name: Deploy

# Puts a commit onto the host running the real stack, over the tailnet.
#
# Dispatch is the only trigger. The automatic path is CI's `deploy-trigger`
# job, which cannot start until every other job in that run has succeeded, so
# "wait until it is green" is expressed as a job dependency rather than as
# something this workflow has to go and check. A human can run it from the
# Actions tab for the same effect on demand.
#
# This repository is public and this workflow holds the keys to a real server.
# What stands between a stranger and that server:
#
#   * Dispatching requires write access to this repository. A fork cannot do
#     it, and a fork's pull request cannot cause it -- CI's trigger job needs a
#     push to main, and a fork PR's token is read-only regardless.
#   * The `production` environment limits deployments to `main` and is what
#     scopes the secrets to this job.
#   * The host independently refuses any commit that is not an ancestor of
#     origin/main. That is what makes the `sha` input below safe to accept: a
#     pull request's head commit is reachable in this repository through
#     refs/pull/N/head, and this is what stops one being deployed.
#   * Everything printed here is publicly readable. The host lives in a secret
#     rather than a variable so Actions masks it in logs, and nothing here runs
#     `docker compose config` or dumps container logs -- both would print real
#     credentials into a public log.
#   * No `${{ }}` interpolation appears inside a `run:` script; values arrive
#     as environment variables, so nothing can be spliced into a shell command.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to deploy. Defaults to the tip of main."
        required: false
      force:
        description: "Redeploy even if this commit is already live and healthy"
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy
    # Without DEPLOY_ENABLED set as a repository variable this workflow is
    # inert, so a fork of this repository cannot be run into a confusing
    # failure by clicking the button.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Set its deployment branch policy to `main`. There is deliberately no
    # required reviewer: the review happens on the pull request, and CI is what
    # holds a commit back until there is evidence for it.
    #
    # Deliberately no `url:`; it would publish the tailnet hostname on every
    # run of a public repository.
    environment: production
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Resolve the commit
        id: target
        env:
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          # Belt and braces before this reaches a remote command line.
          [[ ${SHA} =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::not a full commit sha: ${SHA}"
            exit 1
          }
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "### Deploying \`${SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Join the tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'docker-elk-tailscale' }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          DEPLOY_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # There is no host key to pin: Tailscale SSH generates an ephemeral
          # one per connection. What authenticates this hop is WireGuard plus
          # the tailnet ACL, which only lets tag:ci reach this user on this
          # node -- not the SSH host key. The known_hosts file is per-run and
          # thrown away with the runner.
          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="${RUNNER_TEMP}/known_hosts" \
              -o ConnectTimeout=30 \
              "$DEPLOY_HOST" \
              "DEPLOY_SHA='$DEPLOY_SHA' DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_FORCE='$DEPLOY_FORCE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$HOME/$DEPLOY_PATH"

          # Nothing past this point trusts the checkout, because the deploy
          # script is part of it. Fetch first, prove the commit is on
          # origin/main, and only then check it out.
          git fetch --quiet --prune origin
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main || {
            echo "refusing to deploy ${DEPLOY_SHA}: not an ancestor of origin/main" >&2
            exit 1
          }

          DEPLOY_PREVIOUS_SHA="$(git rev-parse HEAD)"
          export DEPLOY_PREVIOUS_SHA

          git checkout --quiet --detach "$DEPLOY_SHA"

          # Hand off to the just-checked-out script as a *file*, with stdin
          # closed. This heredoc is the remote bash's stdin, and `docker
          # compose exec` forwards stdin to the container -- so running the
          # compose steps from here means the first one eats the rest of the
          # script and the deploy ends silently with exit 0. Keep this
          # bootstrap free of anything that reads stdin.
          exec bash scripts/remote-deploy.sh </dev/null
          REMOTE

      - name: Explain where the logs are
        if: failure()
        run: |
          {
            echo "### Deploy failed"
            echo ""
            echo "Container logs are deliberately not printed here: this log is"
            echo "public and the stack's logs contain real data. Read them on"
            echo "the host:"
            echo ""
            echo '```sh'
            echo "cd ~/<deploy path> && docker compose logs --tail 200"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
