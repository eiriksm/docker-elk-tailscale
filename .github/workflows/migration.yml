name: Migration test

# Restores the last dataset CI published and starts the currently configured
# STACK_VERSION on top of it, in place -- the same thing that happens to the
# real deployment when you bump the version and redeploy.
#
# This is what makes a version bump reviewable: the PR that changes
# STACK_VERSION gets a green or red answer about whether existing data survives
# it, before anyone merges.

on:
  push:
    branches: [main]
  pull_request:
  # Catches upstream image republishes and drift even when nothing changes here.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Dataset tag to restore: a stack version like 9.4.4, or "latest"'
        default: latest
        required: false

concurrency:
  group: migration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  migrate:
    name: migrate (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Raise vm.max_map_count
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Configure
        run: cp .env.example .env

      - uses: oras-project/setup-oras@v2

      - name: Fetch the baseline dataset
        id: fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINE: ${{ inputs.baseline || 'latest' }}
        run: |
          # Anonymous pull is enough for a public package, so a fork PR whose
          # token cannot log in still gets to run the test.
          echo "${GITHUB_TOKEN}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin \
            || echo "::warning::ghcr.io login failed; falling back to anonymous pull"

          if ./scripts/fetch-dataset.sh "${BASELINE}"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "${code}" -eq 3 ]; then
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "::notice::No dataset published at tag '${BASELINE}' yet. Merge to main once so CI can publish a baseline, then this test has something to migrate from."
            else
              exit "${code}"
            fi
          fi

      - name: Report the upgrade under test
        if: steps.fetch.outputs.found == 'true'
        run: |
          from=$(jq -r .stack_version dataset/metadata.json)
          to=$(grep '^STACK_VERSION=' .env.example | cut -d= -f2)
          echo "### Migration: \`${from}\` → \`${to}\` (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          if [ "${from}" = "${to}" ]; then
            echo "::notice::Baseline and target are both ${from}; this run re-tests restart-on-existing-data rather than a version upgrade."
          fi

      - name: Restore the data directory
        if: steps.fetch.outputs.found == 'true'
        run: make import

      - name: Start the new version on it
        if: steps.fetch.outputs.found == 'true'
        run: make up-core

      - name: Verify the migrated data and that ingest still works
        if: steps.fetch.outputs.found == 'true'
        run: COMPOSE_PROFILES= docker compose run --rm toolbox /scripts/verify.sh --check-writes

      - name: Container logs
        if: failure()
        run: COMPOSE_PROFILES= docker compose logs --tail 300

      - name: Tear down
        if: always()
        run: make clean
