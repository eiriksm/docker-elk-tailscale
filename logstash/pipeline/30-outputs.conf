output {
  elasticsearch {
    id => "es-out"
    hosts => ["http://elasticsearch:9200"]
    user => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
    data_stream => false
    index => "logstash-%{+YYYY.MM.dd}"
  }

  # Set by 20-filters.conf, only when SLACK_WEBHOOK_URL is configured and the
  # event matched an alert condition. Never blocks or fails the run that
  # produced it: a bad webhook drops the alert and logs the http output's own
  # error, it doesn't touch the elasticsearch output above.
  if [@metadata][slack_alert] {
    http {
      id => "slack-alert-out"
      url => "%{[@metadata][slack_webhook_url]}"
      http_method => "post"
      format => "json"
      mapping => { "text" => "%{[@metadata][slack_text]}" }
      retry_failed => false
    }
  }
}
