input {
  # Reachable on the tailnet as <TS_LOGSTASH_HOSTNAME>.<tailnet>.ts.net:5044
  # over raw TCP. Traffic is already encrypted by WireGuard.
  beats {
    port => 5044
  }

  # Reachable on the tailnet as https://<TS_LOGSTASH_HOSTNAME>.<tailnet>.ts.net
  # with TLS terminated by Tailscale.
  http {
    port => 8080
    codec => json
  }
}

filter {
  mutate {
    add_field => { "[event][ingested_by]" => "logstash" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
    data_stream => false
    index => "logstash-%{+YYYY.MM.dd}"
  }
}
