# Logstash concatenates every file in this directory in filename order, so the
# pipeline is split by role: inputs, filters, outputs. The split is what makes
# the filters testable -- scripts/test-filters.sh loads 20-filters.conf on its
# own, between a stdin input and a stdout output, with no Elasticsearch and no
# tailnet anywhere near it.

input {
  # Reachable on the tailnet as <TS_LOGSTASH_HOSTNAME>.<tailnet>.ts.net:5044
  # over raw TCP. Traffic is already encrypted by WireGuard.
  beats {
    id => "beats-5044"
    port => 5044
  }

  # Reachable on the tailnet as https://<TS_LOGSTASH_HOSTNAME>.<tailnet>.ts.net
  # with TLS terminated by Tailscale. Three quite different senders arrive here:
  # anything that can POST JSON, scripts/seed.sh, and -- during the transition
  # off the old 7.16.2 host -- that host's mirrored copy of every event it
  # ingests. The filters cannot assume events on this port are unparsed.
  http {
    id => "http-8080"
    port => 8080
    codec => json

    # Under ECS the http input stamps the POST's own transport details onto the
    # event root: [http][version], [http][method], [http][request][body][bytes],
    # [http][request][mime_type], [url][domain], [url][port], [url][path] and --
    # worst of the lot -- [user_agent][original], holding the user agent of
    # whatever posted the request.
    #
    # Those describe the delivery of a log line, not the log line, and they land
    # on exactly the field paths the nginx grok writes to. Left on, a mirrored
    # access log came out with
    #   user_agent.original: ["curl/8.14.1", "Mozilla/5.0 ... Chrome/120"]
    # and the useragent filter then parsed the first element, so every such
    # document claimed the visitor was using curl. [http][version] became an
    # array the same way.
    #
    # `disabled` is what turns that stamping off; it is guarded on exactly this
    # setting inside the plugin. The two target fields then have to be named
    # explicitly, because their defaults in that mode are a bare `headers`
    # object and a bare `host` STRING -- and `host` is an object everywhere else
    # in this index, which is a mapping conflict rather than an untidiness.
    # Pointed at @metadata they stay available to filters and never reach
    # Elasticsearch.
    ecs_compatibility => disabled
    remote_host_target_field => "[@metadata][http][remote_address]"
    request_headers_target_field => "[@metadata][http][headers]"
  }
}
