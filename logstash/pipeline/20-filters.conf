# Everything that shapes an event. Ported from the pipeline on the old 7.16.2
# host, which is mirroring its events here while we transition
# off it. Every plugin carries an `id` so the monitoring API and the test output
# name the stage that misbehaved.

filter {

  # ---------------------------------------------------------------------------
  # Has this event already been parsed?
  #
  # Three kinds of event arrive here already shaped: copies mirrored from the
  # old host, anything replayed into this pipeline, and our own documents if
  # they are ever fed back in. Parsing those a second time is not merely wasted
  # work, it corrupts them:
  #
  #   * grok would run against a `message` its own first pass had rewritten
  #   * every add_field would turn a scalar into a two-element array
  #   * every failure tag would be appended a second time
  #   * `date` would look for a source field its first pass removed
  #
  # So the whole parse chain sits behind one gate, keyed on the fingerprints
  # each producer leaves behind. [event][parsed_by] is ours. [response],
  # [clientip] and [agent] are what the old host's legacy-mode grok produces --
  # it runs with ecs_compatibility disabled, which is the 7.x default.
  # [http][response][status_code] is what ours produces. [syslog_timestamp] and
  # [seconds] come from its syslog and json branches.
  #
  # Deliberately intrinsic rather than a marker header or a flag the sender
  # sets: it stays correct whether or not anyone remembers to configure the
  # other end, and it also covers a replay, which no sender-side flag would.
  # ---------------------------------------------------------------------------
  if [event][parsed_by]
     or [http][response][status_code]
     or [response]
     or [clientip]
     or [syslog_timestamp]
     or [seconds] {
    mutate {
      id => "gate-mark-already-parsed"
      add_field => { "[@metadata][already_parsed]" => "true" }
    }
  }

  if ![@metadata][already_parsed] {

    # ---- nginx access logs -------------------------------------------------
    if "nginx" in [tags] {
      grok {
        id => "nginx-grok"
        # The old host matched %{COMBINEDAPACHELOG}+%{GREEDYDATA:extra_fields}.
        # COMBINEDAPACHELOG is just the legacy alias of HTTPD_COMBINEDLOG, and
        # under ECS the same pattern captures [source][address],
        # [http][request][method], [url][original], [http][version],
        # [http][response][status_code], [http][response][body][bytes],
        # [http][request][referrer] and [user_agent][original] instead of
        # clientip/verb/request/httpversion/response/bytes/referrer/agent.
        #
        # Two no-ops from the original are gone. The `+` was a regex quantifier
        # applied to the preceding pattern -- "one or more combined log lines"
        # -- not a literal plus, and it matched exactly once for every real
        # line. And `overwrite => ["message"]` listed a field this pattern
        # never captures, so it never overwrote anything.
        match => { "message" => "%{HTTPD_COMBINEDLOG}%{GREEDYDATA:extra_fields}" }
      }

      if "_grokparsefailure" not in [tags] {
        date {
          id => "nginx-date"
          # yyyy, where the original had YYYY. In Joda's vocabulary YYYY is the
          # ISO week-based year, which is a different number from the calendar
          # year for a few days each New Year -- 2025-12-29 is a Monday in ISO
          # week 1 of 2026. It is worth spelling correctly, but do not read this
          # as a bug fix: the date filter resolves both to 2025-12-29 here,
          # because the pattern also carries a month and a day of month and
          # those win. YYYY only actually bites in a genuinely week-based
          # pattern, of the form YYYY-'W'ww-e.
          match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
          remove_field => [ "timestamp" ]
        }

        geoip {
          id => "nginx-geoip"
          source => "[source][address]"
          # The parent, not [source][geo]. Under ECS the filter appends its own
          # `geo` object plus a sibling `ip` to whatever target it is given, so
          # naming [source][geo] here buries everything at
          # [source][geo][geo][city_name] and friends.
          target => "[source]"
          add_tag => [ "nginx-geoip" ]
        }

        useragent {
          id => "nginx-useragent"
          source => "[user_agent][original]"
          target => "[user_agent]"
        }
      }

    }

    # ---- syslog ------------------------------------------------------------
    if "syslog" in [tags] {
      grok {
        id => "syslog-grok"
        match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}" }
        # Hash form. The original used the two-element array form,
        # add_field => [ "received_at", "..." ], which is long deprecated.
        # %{host} became %{[host][name]}: under ECS the beats input nests the
        # sending host instead of leaving a bare string at the root.
        add_field => {
          "received_at"   => "%{@timestamp}"
          "received_from" => "%{[host][name]}"
        }
      }

      date {
        id => "syslog-date"
        match => [ "syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
      }
    }

    if "syslog_json" in [tags] and [syslog_message] {
      json {
        id => "syslog-json"
        source => "syslog_message"
      }
    }

    # ---- application JSON --------------------------------------------------
    if "json" in [tags] {
      json {
        id => "json-parse"
        source => "message"
      }

      # [datetime][date] arrives as "2020-06-02 13:20:50.516"; splitting on the
      # dot leaves whole seconds in element 0, which is what `date` can match.
      #
      # The guard is new. The original ran this unconditionally for anything
      # tagged json, so an event without a [datetime][date] field got a
      # `seconds` field containing the literal text "%{[datetime][date][0]}" --
      # an unresolved reference, indexed as data.
      if [datetime][date] {
        mutate {
          id => "json-split-datetime"
          split => { "[datetime][date]" => "." }
        }

        mutate {
          id => "json-add-seconds"
          add_field => { "seconds" => "%{[datetime][date][0]}" }
        }

        date {
          id => "json-date"
          match => [ "seconds", "yyyy-MM-dd HH:mm:ss" ]
        }
      }
    }

    # ---- docker json-file logs ---------------------------------------------
    if "dockerjson" in [tags] {
      json {
        id => "dockerjson-parse"
        source => "message"
      }

      date {
        id => "dockerjson-date"
        match => [ "time", "ISO8601" ]
      }
    }

    # [http][response][status_code] and [http][response][body][bytes] arrive
    # already typed as integers -- the ECS pattern declares `:int` -- so the
    # original's converts for `response` and `bytes` have nothing left to do.
    #
    # `responsetime` is the one that still needs converting, and it has moved
    # out here on purpose. The original converted it inside the nginx branch,
    # but no nginx access line carries it: it comes from an application's own
    # JSON, which is tagged `json`, so the convert could never fire and the
    # field indexed as a string. Guarded on presence rather than on a tag, so
    # whoever emits it next gets a float too.
    if [responsetime] {
      mutate {
        id => "convert-responsetime"
        convert => { "responsetime" => "float" }
      }
    }

    # Closes the gate above for anything that comes back round.
    mutate {
      id => "stamp-parsed-by"
      add_field => { "[event][parsed_by]" => "logstash-tailnet" }
    }
  }

  # ---------------------------------------------------------------------------
  # Legacy field names from the old host, mapped onto ECS.
  #
  # DELETE THIS BLOCK AFTER CUTOVER. It exists so that one index does not end
  # up holding two different shapes of the same event: `response` on the copies
  # the old host parsed, [http][response][status_code] on everything we parse
  # ourselves. A Kibana visualisation cannot straddle both.
  #
  # Guarded on the legacy names, so it is idempotent and a no-op for anything
  # this pipeline parsed itself.
  # ---------------------------------------------------------------------------
  if [response] or [clientip] {
    mutate {
      id => "legacy-rename-to-ecs"
      rename => {
        "clientip"    => "[source][address]"
        "ident"       => "[apache][access][user][identity]"
        "auth"        => "[user][name]"
        "verb"        => "[http][request][method]"
        "request"     => "[url][original]"
        "httpversion" => "[http][version]"
        "response"    => "[http][response][status_code]"
        "bytes"       => "[http][response][body][bytes]"
        "referrer"    => "[http][request][referrer]"
        "agent"       => "[user_agent][original]"
        "geoip"       => "[source][geo]"
      }
    }

    # The old host's geoip filter wrote its `ip` inside the geo object. Ours
    # leaves it a sibling at [source][ip], so move it to match.
    if [source][geo][ip] {
      mutate {
        id => "legacy-move-geo-ip"
        rename => { "[source][geo][ip]" => "[source][ip]" }
      }
    }

    # The legacy pattern captures these two with %{QS}, which keeps the
    # surrounding double quotes; the ECS pattern uses %{DATA} inside the quotes
    # and does not. Strip them so both shapes agree.
    mutate {
      id => "legacy-strip-quotes"
      gsub => [
        "[http][request][referrer]", '^"|"$', "",
        "[user_agent][original]",    '^"|"$', ""
      ]
    }

    mutate {
      id => "legacy-convert"
      convert => {
        "[http][response][status_code]" => "integer"
        "[http][response][body][bytes]" => "integer"
      }
    }
  }

  # Which stack wrote the document. Outside the gate on purpose -- a mirrored
  # copy skips parsing but is still written by us, so it still needs stamping.
  # `replace` rather than `add_field`: add_field on a field that already holds a
  # value turns it into a two-element array, which is how a re-run of this
  # pipeline used to produce ["logstash", "logstash"].
  mutate {
    id => "stamp-ingested-by"
    replace => { "[event][ingested_by]" => "logstash" }
  }

  # ---------------------------------------------------------------------------
  # Slack alerting.
  #
  # Flags on-call-worthy events for the output stage to post; kept here, next
  # to the rest of the field interpretation, rather than next to the HTTP
  # client that ships the alert. Outside the already-parsed gate on purpose,
  # same reasoning as the stamps above -- a mirrored nginx error is still an
  # nginx error. Note that during the migration this can mean the same
  # underlying error is posted twice: once from this host's own ingestion,
  # once from the old host's mirrored copy.
  #
  # ${SLACK_WEBHOOK_URL:} resolves once, at pipeline compile time, to whatever
  # the container's environment holds -- empty when the operator hasn't set
  # one. Checked as a field rather than left to the output stage so that an
  # unconfigured webhook means these events are never flagged at all, instead
  # of being flagged and then failing to post.
  mutate {
    id => "resolve-slack-webhook-configured"
    add_field => { "[@metadata][slack_webhook_url]" => "${SLACK_WEBHOOK_URL:}" }
  }

  # Resolved the same way as the webhook URL above: empty when the operator
  # hasn't set one, which just means the link-appending step below never
  # fires -- the alert still posts, it just has nothing to link to.
  mutate {
    id => "resolve-kibana-public-url"
    add_field => { "[@metadata][kibana_public_url]" => "${KIBANA_PUBLIC_URL:}" }
  }

  if [@metadata][slack_webhook_url] != "" {
    # nginx's own error log, however it got here -- Filebeat's nginx module
    # stamps this on the way in, upstream of anything this pipeline does.
    if [event][dataset] == "nginx.error" {
      # nginx logs this on every worker reload/restart, not just this one --
      # not on-call-worthy, so it never reaches Slack. Matched as a substring
      # rather than an exact equal, since nginx wraps it with a pid/timestamp
      # prefix and other surrounding text.
      if [message] =~ /signal process started/ {
        # noise, deliberately not flagged
      } else {
        mutate {
          id => "flag-slack-alert-nginx-error"
          add_field => {
            "[@metadata][slack_alert]" => "true"
            "[@metadata][slack_text]"  => "nginx error: %{message}"
          }
        }
      }
    # Monolog's JSON formatter (channel/level/level_name/message/context),
    # arriving through the json-tagged HTTP input. Case-insensitive: Monolog
    # writes level_name upper-case ("ERROR"), but nothing here guarantees
    # every producer will.
    } else if [level_name] =~ /^(?i)error$/ {
      # violinist_projects logs one of these every time the update-checker
      # subprocess for a dependency exits non-zero -- which happens for all
      # sorts of routine, non-actionable reasons (the checked repo's own
      # tooling erroring, a registry hiccup, a package with no releases) and
      # says nothing about whether violinist itself is healthy. Not
      # on-call-worthy, so it never reaches Slack; it is still indexed above
      # like any other event.
      #
      # Same channel also logs this one whenever the project behind a node id
      # has been deleted or made inaccessible upstream (renamed, moved
      # private, etc) -- a fact about that project, not about violinist's own
      # health, and not something on-call can act on.
      #
      # And this one whenever the credentials violinist holds for a project
      # have gone stale (a revoked token, an expired install) -- again a fact
      # about that project's access, not about violinist's own health.
      #
      # And this one, which is the same "no access / gone from the workspace"
      # fact as the 404/401 cases above, just phrased as GitLab's own message
      # instead of an HTTP status -- still nothing on-call can act on.
      #
      # And this one, logged whenever the `composer show` subprocess violinist
      # spawns to inspect a dependency runs past its timeout -- a routine
      # hiccup of Composer or the registry it's talking to, not a fact about
      # violinist's own health. The package name and working dir vary, so
      # matched on the "composer' 'show'" substring the process's quoted argv
      # always contains rather than the full literal text.
      if [channel] == "violinist_projects" and ([message] =~ /Exit code from process checking update for .+ was \d+/ or [message] =~ /Caught exception when checking for updates for node id \d+: 404 Project Not Found/ or [message] =~ /Caught exception when checking for updates for node id \d+: 401 Unauthorized/ or [message] =~ /Caught exception when checking for updates for node id \d+: You may not have access to this repository or it no longer exists in this workspace\./ or [message] =~ /Caught exception for process: The process ".*composer' 'show'.* exceeded the timeout of \d+ seconds\./) {
        # noise, deliberately not flagged
      } else {
        mutate {
          id => "flag-slack-alert-level-name"
          add_field => {
            "[@metadata][slack_alert]" => "true"
            "[@metadata][slack_text]"  => "%{level_name} in %{channel}: %{message}"
          }
        }
      }
    }

    # A link straight into Kibana, so acting on an alert doesn't start with
    # manually opening Kibana and guessing a time range. Anchored on the
    # event's own timestamp rather than "now" -- Slack alerts get read well
    # after they fire, and a "last 15 minutes" link is useless by then.
    # Padded five minutes each way so Discover has surrounding context, not
    # just the one document.
    if [@metadata][slack_alert] and [@metadata][kibana_public_url] != "" {
      ruby {
        id => "compute-kibana-link-time-range"
        code => '
          ts = event.get("@timestamp").time
          event.set("[@metadata][kibana_from]", (ts - 300).utc.strftime("%Y-%m-%dT%H:%M:%S.%LZ"))
          event.set("[@metadata][kibana_to]", (ts + 300).utc.strftime("%Y-%m-%dT%H:%M:%S.%LZ"))
        '
      }

      # Built with a ruby filter rather than mutate/replace: Logstash's own
      # config string literals don't interpret "\n" as a newline (it stays
      # as the two literal characters), so the link ended up glued to the
      # alert text with a visible "\n" in Slack. Ruby's string literals do
      # interpret it correctly.
      ruby {
        id => "append-kibana-link"
        code => '
          text = event.get("[@metadata][slack_text]")
          url  = event.get("[@metadata][kibana_public_url]")
          from = event.get("[@metadata][kibana_from]")
          to   = event.get("[@metadata][kibana_to]")
          link = "<#{url}/app/discover#/?_g=(time:(from:\'#{from}\',to:\'#{to}\'))|View in Kibana>"
          event.set("[@metadata][slack_text]", "#{text}\n#{link}")
        '
      }
    }
  }
}
